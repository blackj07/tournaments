<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>810 TOURNAMENT</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:white}.tabs{display:flex;background:#111;position:sticky;top:0}.tabs button{flex:1;padding:15px;border:none;background:#111;color:#fff;font-weight:bold;cursor:pointer}.tabs button.active{background:#ffcc00;color:#000}.page{display:none;padding:15px}.page.show{display:block}.card{background:#1a1a1a;padding:12px;margin:8px 0;border-radius:8px}input,select,button{padding:10px;margin:5px;border-radius:6px;border:none}button{background:#ffcc00;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:8px;text-align:center;font-size:13px}th{background:#222}.poster{background:#fff;color:#000;padding:20px;border-radius:10px;text-align:center;margin:10px 0}.vs{font-size:32px;font-weight:bold}</style>
</head><body>
<div class="tabs">
<button id="b1" class="active" onclick="goPage('home','b1')">HOME</button>
<button id="b2" onclick="goPage('fixtures','b2')">FIXTURES</button>
<button id="b3" onclick="goPage('teams','b3')">TEAMS</button>
<button id="b4" onclick="goPage('table','b4')">TABLE</button>
<button id="b5" onclick="goPage('posters','b5')">POSTERS</button>
</div>
<div id="home" class="page show"><h2>810 SOCCER TOURNAMENT - Pimville</h2><div class="card">Welcome Chairman! Fixtures ready.</div></div>
<div id="fixtures" class="page"><h3>Fixtures</h3><div id="fixList"></div><div class="card"><select id="teamA"></select> vs <select id="teamB"></select><br><input id="scoreA" type="number" placeholder="Goals A" style="width:80px"><input id="scoreB" type="number" placeholder="Goals B" style="width:80px"><button onclick="addResult()">ADD RESULT</button></div></div>
<div id="teams" class="page"><h3>Teams</h3><div id="teamsList"></div><div class="card"><input id="newTeam" placeholder="New Team"><button onclick="addTeam()">ADD TEAM</button></div></div>
<div id="table" class="page"><h3>TABLE P W D L GF GA GD Pts</h3><table><thead><tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div id="posters" class="page"><h3>Posters</h3><div id="posterList"></div></div>
<script>
let teams=["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];
let results=[];
function goPage(p,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('show');document.getElementById(b).classList.add('active');if(p==='fixtures')renderFixtures();if(p==='teams')renderTeams();if(p==='table')renderTable();if(p==='posters')renderPosters();}
function renderTeams(){let a=document.getElementById('teamA'),b=document.getElementById('teamB');a.innerHTML='';b.innerHTML='';teams.forEach(t=>{a.innerHTML+='<option>'+t+'</option>';b.innerHTML+='<option>'+t+'</option>';});let d=document.getElementById('teamsList');d.innerHTML='';teams.forEach((t,i)=>{d.innerHTML+='<div class=card>'+t+' <button onclick=delTeam('+i+') style=float:right;background:red;color:white>X</button></div>';});}
function addTeam(){let v=document.getElementById('newTeam').value.trim();if(!v)return alert('Enter name');if(teams.includes(v))return alert('Exists');teams.push(v);document.getElementById('newTeam').value='';renderTeams();renderTable();}
function delTeam(i){if(!confirm('Delete '+teams[i]+'?'))return;teams.splice(i,1);renderTeams();renderTable();}
function renderFixtures(){let d=document.getElementById('fixList');d.innerHTML='';if(results.length==0)d.innerHTML='<div class=card>No results</div>';results.forEach(r=>{d.innerHTML+='<div class=card>'+r.a+' '+r.sa+' - '+r.sb+' '+r.b+'</div>';});}
function addResult(){let a=document.getElementById('teamA').value,b=document.getElementById('teamB').value,sa=parseInt(document.getElementById('scoreA').value),sb=parseInt(document.getElementById('scoreB').value);if(a===b)return alert('Different teams');if(isNaN(sa)||isNaN(sb))return alert('Enter scores');results.push({a,b,sa,sb});renderFixtures();renderTable();renderPosters();}
function renderTable(){let stats={};teams.forEach(t=>stats[t]={P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0});results.forEach(r=>{if(!stats[r.a]!stats[r.b])return;stats[r.a].P++;stats[r.b].P++;stats[r.a].GF+=r.sa;stats[r.a].GA+=r.sb;stats[r.b].GF+=r.sb;stats[r.b].GA+=r.sa;stats[r.a].GD=stats[r.a].GF-stats[r.a].GA;stats[r.b].GD=stats[r.b].GF-stats[r.b].GA;if(r.sa>r.sb){stats[r.a].W++;stats[r.a].Pts+=3;stats[r.b].L++;}else if(r.sa<r.sb){stats[r.b].W++;stats[r.b].Pts+=3;stats[r.a].L++;}else{stats[r.a].D++;stats[r.b].D++;stats[r.a].Pts+=1;stats[r.b].Pts+=1;}});let sorted=Object.keys(stats).sort((x,y)=>stats[y].Pts-stats[x].Ptsstats[y].GD-stats[x].GD);let tb=document.getElementById('tableBody');tb.innerHTML='';sorted.forEach(t=>{let s=stats[t];tb.innerHTML+='<tr><td>'+t+'</td><td>'+s.P+'</td><td>'+s.W+'</td><td>'+s.D+'</td><td>'+s.L+'</td><td>'+s.GF+'</td><td>'+s.GA+'</td><td>'+s.GD+'</td><td><b>'+s.Pts+'</b></td></tr>';});}
function renderPosters(){let d=document.getElementById('posterList');d.innerHTML='';results.forEach(r=>{d.innerHTML+='<div class=poster><h4>810 TOURNAMENT</h4><div style=display:flex;justify-content:space-around><b>'+r.a+'</b><div style=background:#ffcc00;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center>810</div><b>'+r.b+'</b></div><div class=vs>'+r.sa+' - '+r.sb+'</div><small>Pimville Soweto</small></div>';});if(results.length==0)d.innerHTML='<div class=card>Add results to see posters</div>';}
renderTeams();renderTable();
</script></body></html>
