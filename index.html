<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>810 TOURNAMENT - Pimville</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#111;color:#fff}.tabs{display:flex;position:sticky;top:0;background:#111;z-index:99}.tabs a{flex:1;padding:14px;text-align:center;background:#222;color:#fff;text-decoration:none;font-weight:bold;border:1px solid #000}.tabs a.active{background:#ffcc00;color:#000}.page{display:none;padding:12px}.page:target{display:block}#home{display:block}.page:target~#home{display:none}.card{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:8px}input,select{padding:10px;margin:4px;border-radius:6px;border:none}button{padding:10px 14px;margin:4px;border:none;background:#ffcc00;font-weight:bold;border-radius:6px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:7px;text-align:center;font-size:12px}th{background:#222;color:#ffcc00}</style></head><body>
<div class="tabs"><a href="#home" id="l1" class="active" onclick="act('l1')">HOME</a><a href="#fixtures" id="l2" onclick="act('l2')">FIXTURES</a><a href="#teams" id="l3" onclick="act('l3')">TEAMS</a><a href="#table" id="l4" onclick="act('l4')">TABLE</a><a href="#posters" id="l5" onclick="act('l5')">POSTERS</a></div>
<div id="posters" class="page"><h3>Posters - 810 Logo Middle</h3><div id="posterList">No posters</div></div>
<div id="table" class="page"><h3>League Table P W D L GF GA GD Pts</h3><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div id="teams" class="page"><h3>Teams List</h3><div id="teamsList"></div><div class="card"><input id="newTeam" placeholder="e.g Orlando Pirates"><button onclick="addT()">ADD TEAM</button> <button onclick="resetT()" style="background:white">RESET 8 TEAMS</button></div></div>
<div id="fixtures" class="page"><h3>Fixtures</h3><div id="fixList">No results</div><div class="card"><select id="teamA"></select> vs <select id="teamB"></select><br><input id="scoreA" type="number" placeholder="A" style="width:70px"><input id="scoreB" type="number" placeholder="B" style="width:70px"><button onclick="addR()">ADD RESULT</button></div></div>
<div id="home" class="page"><h2 style="color:#ffcc00">810 SOCCER TOURNAMENT - Pimville, Soweto</h2><div class="card">Chairman welcome!<br>1. Go TEAMS tab<br>2. Click RESET 8 TEAMS<br>3. List will appear</div></div>
<script>
var teams, results;
function act(id){document.querySelectorAll('.tabs a').forEach(a=>a.classList.remove('active'));var e=document.getElementById(id);if(e)e.classList.add('active');}
function init(){teams=["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];results=[];renderTeams();renderFixtures();renderTable();renderPosters();}
function renderTeams(){var a=document.getElementById('teamA'),b=document.getElementById('teamB');a.innerHTML='';b.innerHTML='';for(var i=0;i<teams.length;i++){var op=document.createElement('option');op.text=teams[i];a.add(op);var op2=document.createElement('option');op2.text=teams[i];b.add(op2);}var d=document.getElementById('teamsList');d.innerHTML='';for(var j=0;j<teams.length;j++){d.innerHTML+='<div class=card>'+(j+1)+'. '+teams[j]+' <button onclick=delT('+j+') style=float:right;background:red;color:white;padding:4px 8px>X</button></div>';}}
function addT(){var el=document.getElementById('newTeam');var v=el.value.trim();if(v==''){alert('Type team name');return;}teams.push(v);el.value='';renderTeams();renderTable();alert('Added '+v);}
function delT(i){teams.splice(i,1);renderTeams();renderTable();}
function resetT(){teams=["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];results=[];renderTeams();renderFixtures();renderTable();renderPosters();alert('RESET DONE - 8 teams restored!');window.location.href='#teams';}
function renderFixtures(){var d=document.getElementById('fixList');d.innerHTML='';if(results.length==0){d.innerHTML='<div class=card>No results yet</div>';return;}for(var i=0;i<results.length;i++){var r=results[i];d.innerHTML+='<div class=card>#'+(i+1)+' '+r.a+' '+r.sa+' - '+r.sb+' '+r.b+'</div>';}}
function addR(){var a=document.getElementById('teamA').value,b=document.getElementById('teamB').value,sa=document.getElementById('scoreA').value,sb=document.getElementById('scoreB').value;if(a==b){alert('Pick 2 different teams');return;}if(sa==''||sb==''){alert('Enter scores');return;}results.push({a:a,b:b,sa:parseInt(sa),sb:parseInt(sb)});renderFixtures();renderTable();renderPosters();document.getElementById('scoreA').value='';document.getElementById('scoreB').value='';alert('Result added');}
function renderTable(){var stats={};for(var i=0;i<teams.length;i++){stats[teams[i]]={P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};}for(var k=0;k<results.length;k++){var r=results[k];if(!stats[r.a]!stats[r.b])continue;stats[r.a].P++;stats[r.b].P++;stats[r.a].GF+=r.sa;stats[r.a].GA+=r.sb;stats[r.b].GF+=r.sb;stats[r.b].GA+=r.sa;stats[r.a].GD=stats[r.a].GF-stats[r.a].GA;stats[r.b].GD=stats[r.b].GF-stats[r.b].GA;if(r.sa>r.sb){stats[r.a].W++;stats[r.a].Pts+=3;stats[r.b].L++;}else if(r.sa<r.sb){stats[r.b].W++;stats[r.b].Pts+=3;stats[r.a].L++;}else{stats[r.a].D++;stats[r.b].D++;stats[r.a].Pts+=1;stats[r.b].Pts+=1;}}var sorted=Object.keys(stats).sort(function(x,y){return stats[y].Pts-stats[x].Ptsstats[y].GD-stats[x].GD;});var tb=document.getElementById('tableBody');tb.innerHTML='';for(var s=0;s<sorted.length;s++){var t=sorted[s];var st=stats[t];tb.innerHTML+='<tr><td>'+(s+1)+'</td><td style=text-align:left><b>'+t+'</b></td><td>'+st.P+'</td><td>'+st.W+'</td><td>'+st.D+'</td><td>'+st.L+'</td><td>'+st.GF+'</td><td>'+st.GA+'</td><td>'+st.GD+'</td><td><b>'+st.Pts+'</b></td></tr>';}}
function renderPosters(){var d=document.getElementById('posterList');d.innerHTML='';if(results.length==0){d.innerHTML='<div class=card>No posters - add result first</div>';return;}for(var i=0;i<results.length;i++){var r=results[i];d.innerHTML+='<div class=card style=background:#fff;color:#000;text-align:center'><small>810 TOURNAMENT</small><div style=display:flex;justify-content:space-around;align-items:center;margin:10px 0><b>'+r.a+'</b><div style=width:46px;height:46px;background:#ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #000>810</div><b>'+r.b+'</b></div><div style=font-size:28px;font-weight:900>'+r.sa+' - '+r.sb+'</div></div>';}}
init();
</script></body></html>
