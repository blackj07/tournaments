<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>810 Pimville FC - Tournament Poster Generator - Module 8 Final</title>
<style>
  body { background: #000000; color: white; font-family: Arial, sans-serif; padding: 10px; text-align: center; }
  .box { background: #111111; max-width: 520px; margin: auto; padding: 20px; border-radius: 15px; border: 1px solid #333; }
  h2 { color: #FFD700; margin: 0; }
  select, input { width: 95%; padding: 14px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; background: white; color: black; }
  button { background: #FFD700; color: #000; padding: 15px; width: 48%; font-weight: bold; border: none; border-radius: 10px; margin: 5px; font-size: 16px; cursor: pointer; }
  canvas { width: 100%; max-width: 400px; margin-top: 15px; border: 3px solid #FFD700; border-radius: 12px; }
  small { color: #aaa; }
</style>
</head>
<body>

<div class="box">
  <h2>810 PIMVILLE FC</h2>
  <small>Module 8 - Poster Generator - Option 1 Small Logo Middle</small>
  <br><br>

  <!-- TEAM SELECTION -->
  <label>Team A</label>
  <select id="teamA" onchange="createPoster()">
    <option>JOMO COSMOS</option>
    <option>810 Pimville FC</option>
    <option>Pimville All Stars</option>
    <option>Dube Continental</option>
    <option>Soweto Kings</option>
    <option>TEST FC</option>
  </select>

  <label>Team B</label>
  <select id="teamB" onchange="createPoster()">
    <option>TEST FC</option>
    <option>JOMO COSMOS</option>
    <option>810 Pimville FC</option>
    <option>Pimville All Stars</option>
    <option>Dube Continental</option>
  </select>

  <!-- MATCH DETAILS -->
  <input id="matchDate" type="date" value="2026-10-05" onchange="createPoster()">
  <input id="venue" type="text" value="Pimville Ground • Soweto" placeholder="Venue" onchange="createPoster()">
  <input id="prize" type="text" value="R5000 + Trophy" placeholder="Prize" onchange="createPoster()">
  <input id="contact" type="text" value="065 893 6517" placeholder="Contact" onchange="createPoster()">

  <div>
    <button onclick="createPoster()">CREATE POSTER</button>
    <button onclick="downloadPoster()" style="background:#00ff88">DOWNLOAD PNG</button>
  </div>

  <canvas id="posterCanvas" width="1080" height="1350"></canvas>
  <p id="status" style="color:#FFD700; font-size:14px;"></p>
</div>

<script>
const canvas = document.getElementById("posterCanvas");
const ctx = canvas.getContext("2d");

function createPoster() {
  const teamA = document.getElementById("teamA").value;
  const teamB = document.getElementById("teamB").value;
  const date = document.getElementById("matchDate").value;
  const venue = document.getElementById("venue").value;
  const prize = document.getElementById("prize").value;
  const contact = document.getElementById("contact").value;

  document.getElementById("status").innerText = "Creating poster...";

  // 1. Background - ZCC bottle green gradient
  let gradient = ctx.createLinearGradient(0, 0, 0, 1350);
  gradient.addColorStop(0, "#02150a");
  gradient.addColorStop(0.5, "#0a3d1f");
  gradient.addColorStop(1, "#02150a");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 1080, 1350);

  // 2. Yellow border - double line PSL style
  ctx.strokeStyle = "#FFD700";
  ctx.lineWidth = 5;
  ctx.strokeRect(20, 20, 1040, 1310);
  ctx.lineWidth = 2;
  ctx.strokeRect(40, 40, 1000, 1270);

  // 3. Load your real logo.png from GitHub repo
  const logo = new Image();
  logo.src = "./logo.png";

  logo.onload = function() {
    // OPTION 1 - SMALL LOGO MIDDLE TOP - 200x200
    ctx.drawImage(logo, 440, 50, 200, 200);
    drawAllText(teamA, teamB, date, venue, prize, contact);
    document.getElementById("status").innerText = "Poster ready! Click DOWNLOAD to send to Telegram";
  };
  logo.onerror = function() {
    // If logo.png missing, draw yellow placeholder so poster still works
    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.arc(540, 150, 90, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "black";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.fillText("810", 540, 160);
    drawAllText(teamA, teamB, date, venue, prize, contact);
    document.getElementById("status").innerText = "Logo not found - using placeholder. Make sure logo.png is uploaded";
  };
}

function drawAllText(teamA, teamB, date, venue, prize, contact) {
  // MATCH DAY
  ctx.fillStyle = "#FFD700";
  ctx.font = "bold 42px Arial";
  ctx.textAlign = "center";
  ctx.fillText("MATCH DAY", 540, 350);

  // TEAM A - BIG WHITE
  ctx.fillStyle = "white";
  ctx.font = "bold 90px Arial";
  ctx.fillText(teamA.toUpperCase(), 540, 500);

  // VS - SMALL YELLOW
  ctx.fillStyle = "#FFD700";
  ctx.font = "bold 50px Arial";
  ctx.fillText("VS", 540, 600);

  // TEAM B - BIG WHITE
  ctx.fillStyle = "white";
  ctx.font = "bold 90px Arial";
  ctx.fillText(teamB.toUpperCase(), 540, 730);

  // Info box
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(70, 850, 940, 140);
  ctx.strokeStyle = "#FFD700";
  ctx.lineWidth = 2;
  ctx.strokeRect(70, 850, 940, 140);

  ctx.fillStyle = "white";
  ctx.font = "22px Arial";
  ctx.textAlign = "left";
  ctx.fillText("📅 Date: " + date, 110, 895);
  ctx.fillText("📍 Venue: " + venue, 110, 925);
  ctx.fillText("🏆 Prize: " + prize, 110, 955);

  // Footer
  ctx.textAlign = "center";
  ctx.fillStyle = "#FFD700";
  ctx.font = "16px Arial";
  ctx.fillText("Contact: " + contact + " | blackj07.github.io/tournaments", 540, 1030);
  ctx.fillStyle = "white";
  ctx.font = "14px Arial";
  ctx.fillText("810 Tournament • All teams welcome • Fair play • #810PIMVILLEFC", 540, 1060);
}

function downloadPoster() {
  const link = document.createElement("a");
  link.download = "810-Poster-" + Date.now() + ".png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

// Auto create on page load
window.onload = createPoster;
</script>

</body>
</html>
