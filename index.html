<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>810 TOURNAMENT</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:white}.tabs{display:flex;background:#111;position:sticky;top:0;z-index:9}.tabs a{flex:1;padding:15px;text-align:center;background:#111;color:#fff;text-decoration:none;font-weight:bold}.tabs a:target,.tabs a.active{background:#ffcc00;color:#000}.page{display:none;padding:15px}.page:target{display:block}#home{display:block}.page:target ~ #home{display:none}.card{background:#1a1a1a;padding:12px;margin:8px 0;border-radius:8px}input,select,button{padding:10px;margin:5px;border-radius:6px;border:none}button{background:#ffcc00;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:8px;text-align:center;font-size:12px}th{background:#222}.poster{background:#fff;color:#000;padding:15px;border-radius:10px;text-align:center;margin:10px 0}</style>
</head><body>
<div class="tabs">
<a href="#home" id="l1" onclick="setActive('l1')">HOME</a>
<a href="#fixtures" id="l2" onclick="setActive('l2')">FIXTURES</a>
<a href="#teams" id="l3" onclick="setActive('l3')">TEAMS</a>
<a href="#table" id="l4" onclick="setActive('l4')">TABLE</a>
<a href="#posters" id="l5" onclick="setActive('l5')">POSTERS</a>
</div>

<div id="posters" class="page"><h3>POSTERS</h3><div id="posterList"></div></div>
<div id="table" class="page"><h3>TABLE P W D L GF GA GD Pts</h3><table><thead><tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div id="teams" class="page"><h3>Teams</h3><div id="teamsList"></div><div class="card"><input id="newTeam" placeholder="New Team"><button onclick="addTeam()">ADD</button></div></div>
<div id="fixtures" class="page"><h3>Fixtures</h3><div id="fixList"></div><div class="card"><select id="teamA"></select> vs <select id="teamB"></select><br><input id="scoreA" type="number" placeholder="A" style="width:60px"><input id="scoreB" type="number" placeholder="B" style="width:60px"><button onclick="addResult()">ADD RESULT</button></div></div>
<div id="home" class="page"><h2>810 SOCCER TOURNAMENT - Pimville</h2><div class="card">Welcome Chairman! Click FIXTURES above - this one uses links, no JavaScript needed for clicking.</div></div>

<script>
function setActive(id){document.querySelectorAll('.tabs a').forEach(a=>a.classList.remove('active'));document.getElementById(id).classList.add('active');}
let teams=["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];
let results=[];
function renderTeams(){let a=document.getElementById('teamA'),b=document.getElementById('teamB');if(!a)return;a.innerHTML='';b.innerHTML='';teams.forEach(t=>{a.innerHTML+='<option>'+t+'</option>';b.innerHTML+='<option>'+t+'</option>';});let d=document.getElementById('teamsList');d.innerHTML='';teams.forEach((t,i)=>{d.innerHTML+='<div class=card>'+t+' <button onclick=delTeam('+i+') style=float:right;background:red;color:white>X</button></div>';});}
function addTeam(){let v=document.getElementById('newTeam').value.trim();if(!v)return;teams.push(v);document.getElementById('newTeam').value='';renderTeams();renderTable();}
function delTeam(i){teams.splice(i,1);renderTeams();renderTable();}
function renderFixtures(){let d=document.getElementById('fixList');if(!d)return;d.innerHTML='';if(results.length==0)d.innerHTML='<div class=card>No results</div>';results.forEach(r=>{d.innerHTML+='<div class=card>'+r.a+' '+r.sa+' - '+r.sb+' '+r.b+'</div>';});}
function addResult(){let a=document.getElementById('teamA').value,b=document.getElementById('teamB').value,sa=parseInt(document.getElementById('scoreA').value),sb=parseInt(document.getElementById('scoreB').value);if(a===b)return alert('Different teams');if(isNaN(sa)||isNaN(sb))return alert('Scores');results.push({a,b,sa,sb});renderFixtures();renderTable();renderPosters();}
function renderTable(){let stats={};teams.forEach(t=>stats[t]={P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0});results.forEach(r=>{stats[r.a].P++;stats[r.b].P++;stats[r.a].GF+=r.sa;stats[r.a].GA+=r.sb;stats[r.b].GF+=r.sb;stats[r.b].GA+=r.sa;stats[r.a].GD=stats[r.a].GF-stats[r.a].GA;stats[r.b].GD=stats[r.b].GF-stats[r.b].GA;if(r.sa>r.sb){stats[r.a].W++;stats[r.a].Pts+=3;stats[r.b].L++;}else if(r.sa<r.sb){stats[r.b].W++;stats[r.b].Pts+=3;stats[r.a].L++;}else{stats[r.a].D++;stats[r.b].D++;stats[r.a].Pts+=1;stats[r.b].Pts+=1;}});let s=Object.keys(stats).sort((x,y)=>stats[y].Pts-stats[x].Pts||stats[y].GD-stats[x].GD);let tb=document.getElementById('tableBody');tb.innerHTML='';s.forEach(t=>{let x=stats[t];tb.innerHTML+='<tr><td>'+t+'</td><td>'+x.P+'</td><td>'+x.W+'</td><td>'+x.D+'</td><td>'+x.L+'</td><td>'+x.GF+'</td><td>'+x.GA+'</td><td>'+x.GD+'</td><td><b>'+x.Pts+'</b></td></tr>';});}
function renderPosters(){let d=document.getElementById('posterList');if(!d)return;d.innerHTML='';results.forEach(r=>{d.innerHTML+='<div class=poster><h4>810 TOURNAMENT</h4><b>'+r.a+'</b> vs <b>'+r.b+'</b><div style=font-size:28px;font-weight:bold;margin:10px>'+r.sa+' - '+r.sb+'</div><small>Pimville Soweto - 810 logo middle</small></div>';});if(results.length==0)d.innerHTML='<div class=card>Add results</div>';}
setActive('l1');renderTeams();renderTable();
</script></body></html>
