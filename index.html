<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>810 Pimville FC</title>
<style>
body{margin:0;font-family:Arial;background:#0a3d0a;color:white;text-align:center}
.header{background:#001a00;padding:20px}
.logo{width:80px;height:80px;background:gold;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;color:black;font-weight:bold;border:3px solid white}
.card{background:white;color:black;margin:12px;padding:16px;border-radius:12px;text-align:left}
.btn{background:gold;color:black;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px;width:92%}
.btn-dark{background:#222;color:gold;border:1px solid gold}
.btn-red{background:red;color:white}
input,select{width:92%;padding:11px;margin:6px 0;border-radius:6px;border:1px solid #ccc}
.yellow-bar{background:#001a00;border:2px solid gold;margin:12px;border-radius:12px;padding:14px}
</style>
</head>
<body>

<div class="header">
<div class="logo">810<br>PIMVILLE</div>
<h2>810 PIMVILLE FC</h2>
<p style="color:gold;font-size:13px;">Official Tournaments | Pimville, Soweto</p>
</div>

<div class="card">
<h3>📞 Contact: 065 893 6517 | @810Pimville</h3>
</div>

<div class="yellow-bar">
<h3 style="color:gold;">⚽️ Tournament Registration</h3>
<input id="regTeam" placeholder="Team Name *">
<input id="regPhone" placeholder="Phone Number *">
<input id="regContact" placeholder="Contact Person">
<input id="regLocation" placeholder="Location">
<button class="btn" type="button" onclick="registerTeam()">Register Team</button>
<p style="color:gold;">Teams: <span id="teamCount">0</span> | <span id="lastTeam">No teams yet</span></p>
</div>

<div style="padding:12px;background:#111;border-top:3px solid gold;">
<button class="btn" type="button" onclick="chairmanLogin()">🔐 Chairman Login</button>
<button class="btn btn-dark" type="button" onclick="chairmanLogout()">Logout</button>
<p id="loginStatus" style="color:gold;font-size:11px;"></p>
</div>

<div id="admin" style="display:none;background:#1e1e1e;margin:12px;padding:16px;border-radius:12px;border:2px solid gold;text-align:left;">
<h3 style="color:gold;">Chairman Dashboard</h3>
<div id="teamList" style="background:white;color:black;padding:10px;border-radius:8px;">No teams yet</div>
<br>
<button class="btn btn-dark" type="button" onclick="clearLastTeam()" style="width:44%;">Delete Last</button>
<button class="btn btn-red" type="button" onclick="clearAllTeams()" style="width:44%;">Clear All</button>
<br>
<button class="btn" type="button" onclick="downloadCSV()" style="width:44%;">Download Excel</button>
<button class="btn btn-dark" type="button" onclick="printTeams()" style="width:44%;">Print List</button>

<hr>
<h3 style="color:gold;">🏆 Fixture Generator</h3>
<button class="btn" type="button" onclick="generateFixtures()">Generate Fixtures</button>
<div id="fixturesOutput" style="background:white;color:black;padding:10px;border-radius:8px;margin:8px 0;">No fixtures</div>

<hr>
<h3 style="color:gold;">🎨 Module 8 - Poster Maker</h3>
<select id="posterTeamA"><option>Select Team A</option></select>
<select id="posterTeamB"><option>Select Team B</option></select>
<input id="posterDate" type="date"><input id="posterTime" type="time" value="15:00">
<input id="posterVenue" placeholder="Venue" value="Pimville Ground">
<button class="btn" type="button" onclick="createPoster()">CREATE POSTER</button>
<canvas id="posterCanvas" width="600" height="800" style="display:none;max-width:95%;border:3px solid gold;"></canvas>
<br>
<button id="downloadPosterBtn" class="btn btn-dark" style="display:none;" type="button" onclick="downloadPoster()">Download Poster</button>
</div>

<p style="font-size:11px;color:#aaa;padding:15px;">© 2026 810 Pimville FC</p>

<script>
// FIXED STORAGE
var teams=[];
try{var s=localStorage.getItem("teams810");if(s)teams=JSON.parse(s);}catch(e){teams=[];localStorage.removeItem("teams810");}
function showCounter(){
 try{
  document.getElementById("teamCount").innerText=teams.length;
  var last=document.getElementById("lastTeam");
  var list=document.getElementById("teamList");
  var status=document.getElementById("loginStatus");
  if(status) status.innerText = localStorage.getItem("isChairman")==="yes"? "Logged in as Chairman" : "";
  if(teams.length==0){
    if(last) last.innerText="No teams yet";
    if(list) list.innerHTML="No teams yet";
  } else {
    if(last) last.innerText="Last: "+teams[teams.length-1].team;
    var h="";for(var i=0;i<teams.length;i++)h+=(i+1)+". "+teams[i].team+" - "+teams[i].phone+"<br>";
    if(list) list.innerHTML=h;
  }
  // Poster dropdowns - SAFE MODE
  var selA=document.getElementById("posterTeamA");
  var selB=document.getElementById("posterTeamB");
  if(selA && selB){
    selA.innerHTML='<option>Select Team A</option>';
    selB.innerHTML='<option>Select Team B</option>';
    for(var i=0;i<teams.length;i++){
      var o1=document.createElement("option");o1.value=teams[i].team;o1.text=teams[i].team;selA.appendChild(o1);
      var o2=document.createElement("option");o2.value=teams[i].team;o2.text=teams[i].team;selB.appendChild(o2);
    }
  }
 }catch(err){alert("Display error: "+err.message);}
}

function registerTeam(){
 try{
  var team=document.getElementById('regTeam').value.trim();
  var phone=document.getElementById('regPhone').value.trim();
  var contact=document.getElementById('regContact').value.trim();
  var loc=document.getElementById('regLocation').value.trim();
  if(!team){alert("Enter Team Name");return;}
  if(!phone){alert("Enter Phone");return;}
  teams.push({team:team,phone:phone,contact:contact,location:loc});
  localStorage.setItem("teams810",JSON.stringify(teams));
  showCounter();
  alert("✅ Registered: "+team);
  var msg="810 PIMVILLE: "+team+" - "+phone;
  window.open("https://wa.me/27658936517?text="+encodeURIComponent(msg),"_blank");
  document.getElementById('regTeam').value="";document.getElementById('regPhone').value="";document.getElementById('regContact').value="";document.getElementById('regLocation').value="";
 }catch(err){alert("Register error: "+err.message);}
}

function chairmanLogin(){
 try{
  var p=prompt("Chairman Password:");
  if(p===null)return;
  if(p.trim()==="810Pimville2025"){
   document.getElementById("admin").style.display="block";
   localStorage.setItem("isChairman","yes");
   showCounter();
   alert("✅ Logged in!");
  }else{alert("Wrong password");}
 }catch(err){alert("Login error: "+err.message);}
}

function chairmanLogout(){
 try{
  document.getElementById("admin").style.display="none";
  localStorage.removeItem("isChairman");
  showCounter();
  alert("Logged out");
 }catch(err){alert(err.message);}
}

function clearLastTeam(){if(teams.length==0)return;teams.pop();localStorage.setItem("teams810",JSON.stringify(teams));showCounter();}
function clearAllTeams(){if(confirm("Delete ALL teams?")){teams=[];localStorage.setItem("teams810",JSON.stringify(teams));showCounter();}}
function downloadCSV(){if(teams.length==0){alert("No teams");return;}var csv="Team,Phone\n";for(var i=0;i<teams.length;i++)csv+=teams[i].team+","+teams[i].phone+"\n";var blob=new Blob([csv],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="810_Teams.csv";a.click();}
function printTeams(){if(teams.length==0){alert("No teams");return;}var w=window.open("","","width=800,height=600");var h="<h2>810 Teams</h2><ol>";for(var i=0;i<teams.length;i++)h+="<li>"+teams[i].team+"</li>";h+="</ol>";w.document.write(h);w.print();}
function generateFixtures(){if(teams.length<2){alert("Need 2 teams");return;}var out=document.getElementById("fixturesOutput");var html="";for(var i=0;i<teams.length-1;i+=2){html+="Match "+(i/2+1)+": "+teams[i].team+" vs "+teams[i+1].team+"<br>";}out.innerHTML=html;}
function createPoster(){
 var teamA=document.getElementById("posterTeamA").value;
 var teamB=document.getElementById("posterTeamB").value;
 if(!teamA  teamA==="Select Team A" !teamB || teamB==="Select Team B"){alert("Select 2 teams first - Register teams!");return;}
 var canvas=document.getElementById("posterCanvas");var ctx=canvas.getContext("2d");
 ctx.fillStyle="#001a00";ctx.fillRect(0,0,600,800);
 ctx.fillStyle="gold";ctx.font="bold 40px Arial";ctx.textAlign="center";ctx.fillText(teamA,300,300);
 ctx.fillText("VS",300,380);
 ctx.fillText(teamB,300,460);
 ctx.fillStyle="white";ctx.font="20px Arial";ctx.fillText(document.getElementById("posterDate").value+" "+document.getElementById("posterTime").value,300,550);
 ctx.fillText(document.getElementById("posterVenue").value,300,580);
 canvas.style.display="block";
 document.getElementById("downloadPosterBtn").style.display="block";
}
function downloadPoster(){var c=document.getElementById("posterCanvas");var a=document.createElement("a");a.download="Poster.png";a.href=c.toDataURL();a.click();}

showCounter();
if(localStorage.getItem("isChairman")==="yes"){document.getElementById("admin").style.display="block";}
</script>
</body>
</html>
