<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>810 Pimville - Tournament Poster Generator</title>
<style>
body{ background:#0a0a0a; color:white; font-family:Arial; text-align:center; padding:10px; }
input,select{ width:90%; padding:12px; margin:8px; border-radius:8px; border:none; font-size:16px; }
button{ background:#FFD700; color:#000; padding:15px 30px; font-weight:bold; border:none; border-radius:10px; font-size:18px; cursor:pointer; margin:10px; }
#posterCanvas{ width:90%; max-width:400px; margin-top:15px; border:2px solid #FFD700; }
.box{ background:#111; padding:15px; border-radius:15px; max-width:500px; margin:auto; }
</style>
</head>
<body>
<div class="box">
<h2 style="color:#FFD700">810 PIMVILLE FC - Poster Generator</h2>
<p>Module 8 - Final</p>

<select id="teamA">
<option>Select Team A</option>
<option>JOMO COSMOS</option>
<option>810 Pimville FC</option>
<option>Pimville All Stars</option>
<option>Dube Continental</option>
<option>Soweto Kings</option>
<option>TEST FC</option>
</select>

<select id="teamB">
<option>Select Team B</option>
<option>TEST FC</option>
<option>JOMO COSMOS</option>
<option>810 Pimville FC</option>
<option>Pimville All Stars</option>
<option>Dube Continental</option>
</select>

<input type="date" id="date" value="2026-10-05">
<input type="text" id="venue" value="Pimville Ground • Soweto">
<input type="text" id="prize" value="R5000 + Trophy">
<input type="text" id="contact" value="065 893 6517">

<button onclick="createPoster()">CREATE POSTER NOW</button>
<button onclick="downloadPoster()" style="background:#00ff88">DOWNLOAD PNG</button>

<br>
<canvas id="posterCanvas" width="1080" height="1920"></canvas>
</div>

<script>
const canvas = document.getElementById("posterCanvas");
const ctx = canvas.getContext("2d");

function createPoster(){
  const teamA = document.getElementById("teamA").value;
  const teamB = document.getElementById("teamB").value;
  const date = document.getElementById("date").value;
  const venue = document.getElementById("venue").value;
  const prize = document.getElementById("prize").value;

  // Background - ZCC dark green
  let grad = ctx.createLinearGradient(0,0,0,1920);
  grad.addColorStop(0, "#02150a");
  grad.addColorStop(0.5, "#0a3d1f");
  grad.addColorStop(1, "#02150a");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,1080,1920);

  // Stadium lights glow
  ctx.fillStyle = "rgba(255,215,0,0.15)";
  for(let i=0;i<20;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*1080, Math.random()*600, 30+Math.random()*40, 0, Math.PI*2);
    ctx.fill();
  }

  // Yellow border double
  ctx.strokeStyle = "#FFD700";
  ctx.lineWidth = 4;
  ctx.strokeRect(30,30,1020,1860);
  ctx.lineWidth = 2;
  ctx.strokeRect(50,50,980,1820);

  // Logo - load your real logo.png from GitHub
  const logo = new Image();
  logo.crossOrigin = "anonymous";
  logo.src = "logo.png?v=" + Date.now(); // prevent cache

  logo.onload = () => {
    // draw logo centered top
    ctx.drawImage(logo, 240, 80, 600, 600);

    // MATCH DAY
    ctx.fillStyle = "#FFD700";
    ctx.font = "bold 60px Arial";
    ctx.letterSpacing = "10px";
    ctx.textAlign = "center";
    ctx.fillText("MATCH DAY", 540, 800);

    // Team A BIG WHITE
    ctx.fillStyle = "white";
    ctx.font = "bold 110px Arial";
    ctx.textAlign = "center";
    wrapText(teamA.toUpperCase(), 540, 950, 900, 110);

    // VS small yellow
    ctx.fillStyle = "#FFD700";
    ctx.font = "bold 60px Arial";
    ctx.fillText("VS", 540, 1130);

    // Team B BIG WHITE
    ctx.fillStyle = "white";
    ctx.font = "bold 110px Arial";
    ctx.fillText(teamB.toUpperCase(), 540, 1310);

    // Info box
    ctx.fillStyle = "rgba(0,30,15,0.9)";
    ctx.fillRect(80, 1420, 920, 160);
    ctx.strokeStyle = "#FFD700";
    ctx.lineWidth = 2;
    ctx.strokeRect(80, 1420, 920, 160);
    ctx.fillStyle = "white";
    ctx.font = "bold 28px Arial";
    ctx.textAlign = "left";
    ctx.fillText("📅 " + date, 120, 1480);
    ctx.fillText("📍 " + venue, 120, 1520);
    ctx.fillText("🏆 " + prize, 120, 1560);

    // Footer
    ctx.fillStyle = "#FFD700";
    ctx.font = "24px Arial";
    ctx.textAlign = "center";
    ctx.fillText("810 Tournament • All teams welcome • Fair play", 540, 1670);
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Contact: " + document.getElementById("contact").value + " • #810PIMVILLEFC", 540, 1710);
    ctx.fillText("blackj07.github.io/tournaments", 540, 1740);
  };

  logo.onerror = () => {
    alert("Logo not found! Make sure logo.png is in same folder on GitHub. Using placeholder for now.");
    ctx.fillStyle = "white";
    ctx.fillRect(240,80,600,600);
  }
}

function wrapText(text, x, y, maxWidth, lineHeight){
  let words = text.split(" ");
  let line = "";
  let lines = [];
  for(let n=0;n<words.length;n++){
    let testLine = line + words[n] + " ";
    let metrics = ctx.measureText(testLine);
    if(metrics.width > maxWidth && n>0){
      lines.push(line);
      line = words[n] + " ";
    } else {
      line = testLine;
    }
  }
  lines.push(line);
  for(let i=0;i<lines.length;i++){
    ctx.fillText(lines[i].trim(), x, y + (i*lineHeight));
  }
}

function downloadPoster(){
  const link = document.createElement("a");
  link.download = "810-Poster-" + Date.now() + ".png";
  link.href = canvas.toDataURL();
  link.click();
}

// auto create on load
window.onload = createPoster;
</script>
</body>
</html>
