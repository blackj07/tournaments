<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>810 Pimville Poster Gen</title>
<style>
body{ background:#000; color:#fff; font-family:Arial; padding:10px; text-align:center; }
.box{ background:#111; max-width:500px; margin:auto; padding:15px; border-radius:15px; border:1px solid #333; }
select,input{ width:95%; padding:14px; margin:8px 0; border-radius:8px; border:none; font-size:16px; }
button{ background:#FFD700; color:#000; padding:16px; width:95%; font-weight:bold; border:none; border-radius:10px; margin:10px 0; font-size:18px; }
canvas{ width:100%; max-width:380px; margin-top:15px; border:2px solid #FFD700; border-radius:10px; }
</style>
</head>
<body>
<div class="box">
<h2 style="color:#FFD700; margin:0">810 PIMVILLE FC</h2>
<small>Option 1 - Small Logo Middle - WORKING</small><br><br>

<select id="teamA"><option>JOMO COSMOS</option><option>810 Pimville FC</option><option>Pimville All Stars</option><option>TEST FC</option><option>Dube Continental</option></select>
<select id="teamB"><option>TEST FC</option><option>JOMO COSMOS</option><option>810 Pimville FC</option><option>Pimville All Stars</option></select>
<input id="date" type="date" value="2026-10-05">
<input id="venue" type="text" value="Pimville Ground • Soweto">
<input id="prize" type="text" value="R5000 + Trophy">

<button onclick="makePoster()">CREATE POSTER NOW</button>
<button onclick="download()" style="background:#00ff88">DOWNLOAD PNG - Send to Telegram</button>
<canvas id="c" width="1080" height="1350"></canvas>
<p id="status" style="color:#FFD700"></p>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function makePoster(){
 document.getElementById("status").innerText = "Creating...";
 const A = document.getElementById("teamA").value;
 const B = document.getElementById("teamB").value;
 const D = document.getElementById("date").value;
 const V = document.getElementById("venue").value;
 const P = document.getElementById("prize").value;

 // bg
 ctx.fillStyle = "#0a2e1a"; ctx.fillRect(0,0,1080,1350);
 ctx.strokeStyle="#FFD700"; ctx.lineWidth=6; ctx.strokeRect(15,15,1050,1320);
 ctx.lineWidth=2; ctx.strokeRect(35,35,1010,1280);

 const logo = new Image();
 logo.src = "./logo.png"; // FIXED PATH
 logo.onload = function(){
   ctx.drawImage(logo, 430, 50, 220, 220);
   drawText(A,B,D,V,P);
   document.getElementById("status").innerText = "Done! Now DOWNLOAD";
 };
 logo.onerror = function(){
   // If logo fails, draw without logo so poster still works
   ctx.fillStyle="#FFD700"; ctx.beginPath(); ctx.arc(540,160,90,0,Math.PI*2); ctx.fill();
   ctx.fillStyle="#000"; ctx.font="bold 30px Arial"; ctx.textAlign="center"; ctx.fillText("810",540,170);
   drawText(A,B,D,V,P);
   document.getElementById("status").innerText = "Logo.png not found but poster created! Check file name";
 };
}
function drawText(A,B,D,V,P){
  ctx.textAlign="center";
  ctx.fillStyle="#FFD700"; ctx.font="bold 45px Arial"; ctx.fillText("MATCH DAY",540,360);
  ctx.fillStyle="white"; ctx.font="bold 95px Arial"; ctx.fillText(A.toUpperCase(),540,500);
  ctx.fillStyle="#FFD700"; ctx.font="bold 50px Arial"; ctx.fillText("VS",540,600);
  ctx.fillStyle="white"; ctx.font="bold 95px Arial"; ctx.fillText(B.toUpperCase(),540,730);
  ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(70,850,940,140);
  ctx.strokeStyle="#FFD700"; ctx.strokeRect(70,850,940,140);
  ctx.fillStyle="white"; ctx.font="24px Arial"; ctx.textAlign="left";
  ctx.fillText("📅 Date: "+D,110,900);
  ctx.fillText("📍 Venue: "+V,110,935);
  ctx.fillText("🏆 Prize: "+P,110,970);
  ctx.textAlign="center"; ctx.fillStyle="#FFD700"; ctx.font="18px Arial";
  ctx.fillText("Contact: 065 893 6517 | blackj07.github.io/tournaments",540,1050);
}
function download(){
  const a=document.createElement("a"); a.download="810-Poster-"+Date.now()+".png"; a.href=canvas.toDataURL("image/png"); a.click();
}
window.onload=makePoster;
</script>
</body>
</html>
