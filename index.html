<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>810 TOURNAMENT - Pimville</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0e0e0e;color:#fff}.tabs{display:flex;background:#111;position:sticky;top:0;z-index:99}.tabs a{flex:1;padding:14px;text-align:center;background:#111;color:#fff;text-decoration:none;font-weight:bold}.tabs a.active{background:#ffcc00;color:#000}.page{display:none;padding:12px}.page:target{display:block}#home{display:block}.page:target~#home{display:none}.card{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:8px}input,select,button{padding:10px;margin:4px;border-radius:6px;border:1px solid #333}button{background:#ffcc00;font-weight:bold;cursor:pointer;color:#000}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:7px;text-align:center;font-size:12px}th{background:#222;color:#ffcc00}.poster{background:#fff;color:#000;padding:15px;border-radius:10px;text-align:center;margin:10px 0}</style></head><body>
<div class="tabs"><a href="#home" id="l1" class="active" onclick="setA('l1')">HOME</a><a href="#fixtures" id="l2" onclick="setA('l2')">FIXTURES</a><a href="#teams" id="l3" onclick="setA('l3')">TEAMS</a><a href="#table" id="l4" onclick="setA('l4')">TABLE</a><a href="#posters" id="l5" onclick="setA('l5')">POSTERS</a></div>
<div id="posters" class="page"><h3>Match Posters - 810 Logo Middle</h3><div id="posterList"></div></div>
<div id="table" class="page"><h3>League Table</h3><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div id="teams" class="page"><h3>Teams</h3><div id="teamsList"></div><div class="card"><input id="newTeam" placeholder="Orlando Pirates etc"><button type="button" onclick="addTeam()">ADD TEAM</button> <button type="button" onclick="resetTeams()" style="background:#fff">RESET 8 TEAMS</button></div></div>
<div id="fixtures" class="page"><h3>Fixtures</h3><div id="fixList"></div><div class="card"><label>Team A:</label><select id="teamA"></select> <label>vs Team B:</label><select id="teamB"></select><br><input id="scoreA" type="number" placeholder="Goals A" style="width:80px"><input id="scoreB" type="number" placeholder="Goals B" style="width:80px"><button type="button" onclick="addResult()">ADD RESULT</button></div></div>
<div id="home" class="page"><h2 style="color:#ffcc00">810 SOCCER TOURNAMENT - Pimville, Soweto</h2><div class="card">Welcome Chairman! Official system.<br>• If teams empty, click RESET 8 TEAMS<br>• Add scores in FIXTURES tab<br>• Table auto sorts</div></div>
<script>
function setA(id){document.querySelectorAll('.tabs a').forEach(a=>a.classList.remove('active'));document.getElementById(id).classList.add('active');}
var defaultTeams=["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];
var teams=JSON.parse(localStorage.getItem('teams810')'null')defaultTeams.slice();
if(!teams||teams.length==0)teams=defaultTeams.slice();
var results=JSON.parse(localStorage.getItem('results810')||'[]');
function save(){localStorage.setItem('teams810',JSON.stringify(teams));localStorage.setItem('results810',JSON.stringify(results));}
function resetTeams(){localStorage.removeItem('teams810');teams=defaultTeams.slice();save();renderTeams();renderTable();alert('8 Teams restored!');location.href='#teams';}
window.addTeam=function(){var inp=document.getElementById('newTeam');var v=(inp.value||'').trim();if(!v){alert('Type team name');return;}if(teams.includes(v)){alert('Exists');return;}teams.push(v);inp.value='';save();renderTeams();renderTable();};
window.delTeam=function(i){if(!confirm('Delete '+teams[i]+'?'))return;teams.splice(i,1);save();renderTeams();renderTable();renderFixtures();};
window.renderTeams=function(){var a=document.getElementById('teamA'),b=document.getElementById('teamB');if(a){a.innerHTML='';b.innerHTML='';teams.forEach(function(t){a.innerHTML+='<option>'+t+'</option>';b.innerHTML+='<option>'+t+'</option>';});}var d=document.getElementById('teamsList');if(!d)return;d.innerHTML='';teams.forEach(function(t,i){d.innerHTML+='<div class=card>'+(i+1)+'. '+t+' <button type=button onclick=delTeam('+i+') style=float:right;background:red;color:white>X</button></div>';});};
window.renderFixtures=function(){var d=document.getElementById('fixList');if(!d)return;d.innerHTML='';if(results.length==0)d.innerHTML='<div class=card>No results</div>';results.forEach(function(r,i){d.innerHTML+='<div class=card>#'+(i+1)+' '+r.a+' '+r.sa+' - '+r.sb+' '+r.b+'</div>';});};
window.addResult=function(){var a=document.getElementById('teamA').value,b=document.getElementById('teamB').value,sa=parseInt(document.getElementById('scoreA').value),sb=parseInt(document.getElementById('scoreB').value);if(a===b){alert('Pick different teams');return;}if(isNaN(sa)||isNaN(sb)){alert('Enter scores');return;}results.push({a:a,b:b,sa:sa,sb:sb});save();renderFixtures();renderTable();renderPosters();document.getElementById('scoreA').value='';document.getElementById('scoreB').value='';};
window.renderTable=function(){var stats={};teams.forEach(function(t){stats[t]={P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};});results.forEach(function(r){if(!stats[r.a]!stats[r.b])return;stats[r.a].P++;stats[r.b].P++;stats[r.a].GF+=r.sa;stats[r.a].GA+=r.sb;stats[r.b].GF+=r.sb;stats[r.b].GA+=r.sa;stats[r.a].GD=stats[r.a].GF-stats[r.a].GA;stats[r.b].GD=stats[r.b].GF-stats[r.b].GA;if(r.sa>r.sb){stats[r.a].W++;stats[r.a].Pts+=3;stats[r.b].L++;}else if(r.sa<r.sb){stats[r.b].W++;stats[r.b].Pts+=3;stats[r.a].L++;}else{stats[r.a].D++;stats[r.b].D++;stats[r.a].Pts+=1;stats[r.b].Pts+=1;}});var sorted=Object.keys(stats).sort(function(x,y){return stats[y].Pts-stats[x].Ptsstats[y].GD-stats[x].GD;});var tb=document.getElementById('tableBody');tb.innerHTML='';sorted.forEach(function(t,i){var s=stats[t];tb.innerHTML+='<tr><td>'+(i+1)+'</td><td style=text-align:left>'+t+'</td><td>'+s.P+'</td><td>'+s.W+'</td><td>'+s.D+'</td><td>'+s.L+'</td><td>'+s.GF+'</td><td>'+s.GA+'</td><td>'+s.GD+'</td><td><b>'+s.Pts+'</b></td></tr>';});};
window.renderPosters=function(){var d=document.getElementById('posterList');if(!d)return;d.innerHTML='';results.forEach(function(r){d.innerHTML+='<div class=poster><small>810 TOURNAMENT</small><div style=display:flex;justify-content:space-around;align-items:center;margin:10px 0><b>'+r.a+'</b><div style=width:45px;height:45px;background:#ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #000>810</div><b>'+r.b+'</b></div><div style=font-size:28px;font-weight:900>'+r.sa+' - '+r.sb+'</div></div>';});if(results.length==0)d.innerHTML='<div class=card>No posters - add results first</div>';};
renderTeams();renderFixtures();renderTable();renderPosters();
</script></body></html>
