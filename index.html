<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>810 TOURNAMENT Pimville</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#111;color:#fff}.tabs{display:flex;position:sticky;top:0;background:#111}.tabs a{flex:1;padding:14px;text-align:center;background:#222;color:#fff;text-decoration:none;font-weight:bold;border:1px solid #000}.tabs a.active{background:#ffcc00;color:#000}.page{display:none;padding:12px}.page:target{display:block}#home{display:block}.page:target~#home{display:none}.card{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:8px}input,select{padding:10px;margin:4px;border-radius:6px;border:none}button{padding:10px 14px;margin:4px;border:none;background:#ffcc00;font-weight:bold;border-radius:6px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:7px;text-align:center;font-size:12px}th{background:#222;color:#ffcc00}</style></head><body>
<div class="tabs"><a href="#home" id="l1" class="active" onclick="act('l1')">HOME</a><a href="#fixtures" id="l2" onclick="act('l2')">FIXTURES</a><a href="#teams" id="l3" onclick="act('l3')">TEAMS</a><a href="#table" id="l4" onclick="act('l4')">TABLE</a><a href="#posters" id="l5" onclick="act('l5')">POSTERS</a></div>
<div id="posters" class="page"><h3>Posters</h3><div id="posterList">No posters</div></div>
<div id="table" class="page"><h3>League Table</h3><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div id="teams" class="page"><h3>Teams List</h3><div id="teamsList"></div><div class="card"><input id="newTeam" placeholder="Orlando Pirates"><button onclick="addT()">ADD TEAM</button> <button onclick="resetT()" style="background:#fff">RESET 8 TEAMS</button></div></div>
<div id="fixtures" class="page"><h3>Fixtures</h3><div id="fixList">No results</div><div class="card"><select id="teamA"></select> vs <select id="teamB"></select><br><input id="scoreA" type="number" placeholder="A" style="width:70px"><input id="scoreB" type="number" placeholder="B" style="width:70px"><button onclick="addR()">ADD RESULT</button></div></div>
<div id="home" class="page"><h2 style="color:#ffcc00">810 TOURNAMENT - Pimville Soweto</h2><div class="card">1. Go TEAMS 2. Click RESET 8 TEAMS 3. ADD TEAM now works</div></div>
<script>
var teams = ["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];
var results = [];
function act(id){var links=document.querySelectorAll('.tabs a');for(var i=0;i<links.length;i++){links[i].classList.remove('active');}document.getElementById(id).classList.add('active');}
function renderTeams(){var a=document.getElementById('teamA');var b=document.getElementById('teamB');a.innerHTML='';b.innerHTML='';for(var i=0;i<teams.length;i++){var o1=document.createElement('option');o1.text=teams[i];a.add(o1);var o2=document.createElement('option');o2.text=teams[i];b.add(o2);}var d=document.getElementById('teamsList');d.innerHTML='';for(var j=0;j<teams.length;j++){d.innerHTML=d.innerHTML+'<div class=card>'+(j+1)+'. '+teams[j]+' <button onclick=delT('+j+') style=float:right;background:red;color:white;padding:4px 8px>X</button></div>';}}
function addT(){var el=document.getElementById('newTeam');var v=el.value;v=v.trim();if(v==''){alert('Type team name');return;}teams.push(v);el.value='';renderTeams();renderTable();alert('Added '+v);}
function delT(i){teams.splice(i,1);renderTeams();renderTable();}
function resetT(){teams=["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];results=[];renderTeams();renderFixtures();renderTable();renderPosters();alert('RESET DONE');window.location.href='#teams';}
function renderFixtures(){var d=document.getElementById('fixList');d.innerHTML='';if(results.length==0){d.innerHTML='<div class=card>No results yet</div>';return;}for(var i=0;i<results.length;i++){var r=results[i];d.innerHTML=d.innerHTML+'<div class=card>#'+(i+1)+' '+r.a+' '+r.sa+' - '+r.sb+' '+r.b+'</div>';}}
function addR(){var a=document.getElementById('teamA').value;var b=document.getElementById('teamB').value;var sa=document.getElementById('scoreA').value;var sb=document.getElementById('scoreB').value;if(a==b){alert('Pick 2 different teams');return;}if(sa==''||sb==''){alert('Enter scores');return;}results.push({a:a,b:b,sa:parseInt(sa),sb:parseInt(sb)});renderFixtures();renderTable();renderPosters();document.getElementById('scoreA').value='';document.getElementById('scoreB').value='';alert('Result added');}
function renderTable(){var stats={};for(var i=0;i<teams.length;i++){stats[teams[i]]={P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};}for(var k=0;k<results.length;k++){var r=results[k];if(stats[r.a]==nullstats[r.b]==null)continue;stats[r.a].P++;stats[r.b].P++;stats[r.a].GF+=r.sa;stats[r.a].GA+=r.sb;stats[r.b].GF+=r.sb;stats[r.b].GA+=r.sa;stats[r.a].GD=stats[r.a].GF-stats[r.a].GA;stats[r.b].GD=stats[r.b].GF-stats[r.b].GA;if(r.sa>r.sb){stats[r.a].W++;stats[r.a].Pts+=3;stats[r.b].L++;}else if(r.sa<r.sb){stats[r.b].W++;stats[r.b].Pts+=3;stats[r.a].L++;}else{stats[r.a].D++;stats[r.b].D++;stats[r.a].Pts+=1;stats[r.b].Pts+=1;}}var keys=Object.keys(stats);keys.sort(function(x,y){return stats[y].Pts-stats[x].Ptsstats[y].GD-stats[x].GD;});var tb=document.getElementById('tableBody');tb.innerHTML='';for(var s=0;s<keys.length;s++){var t=keys[s];var st=stats[t];tb.innerHTML=tb.innerHTML+'<tr><td>'+(s+1)+'</td><td style=text-align:left><b>'+t+'</b></td><td>'+st.P+'</td><td>'+st.W+'</td><td>'+st.D+'</td><td>'+st.L+'</td><td>'+st.GF+'</td><td>'+st.GA+'</td><td>'+st.GD+'</td><td><b>'+st.Pts+'</b></td></tr>';}}
function renderPosters(){var d=document.getElementById('posterList');d.innerHTML='';if(results.length==0){d.innerHTML='<div class=card>No posters yet</div>';return;}for(var i=0;i<results.length;i++){var r=results[i];d.innerHTML=d.innerHTML+'<div class=card style=background:#fff;color:#000;text-align:center"><small>810 TOURNAMENT</small><div style=display:flex;justify-content:space-around;align-items:center;margin:10px 0><b>'+r.a+'</b><div style=width:46px;height:46px;background:#ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #000>810</div><b>'+r.b+'</b></div><div style=font-size:28px;font-weight:900>'+r.sa+' - '+r.sb+'</div></div>';}}
renderTeams();renderFixtures();renderTable();renderPosters();
</script></body></html>
