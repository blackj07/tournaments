<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>810 TOURNAMENT - Soweto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:white}
.tabs{display:flex;background:#111;position:sticky;top:0;z-index:99}
.tabs button{flex:1;padding:15px;border:none;background:#111;color:white;font-weight:bold;cursor:pointer}
.tabs button.active{background:#ffcc00;color:black}
.page{display:none;padding:15px}
.page.show{display:block}
.card{background:#1a1a1a;padding:12px;margin:8px 0;border-radius:8px}
input,select,button{padding:10px;margin:5px;border-radius:6px;border:none}
button{background:#ffcc00;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #333;padding:8px;text-align:center;font-size:13px}
th{background:#222}
.poster{background:white;color:black;padding:20px;border-radius:10px;text-align:center;margin:10px 0}
.vs{font-size:40px;font-weight:bold;margin:10px}
.logoSmall{width:50px;height:50px;background:#ffcc00;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;font-weight:bold;color:black}
</style>
</head>
<body>

<div class="tabs">
<button id="b1" class="active" onclick="goPage('home','b1')">HOME</button>
<button id="b2" onclick="goPage('fixtures','b2')">FIXTURES</button>
<button id="b3" onclick="goPage('teams','b3')">TEAMS</button>
<button id="b4" onclick="goPage('table','b4')">TABLE</button>
<button id="b5" onclick="goPage('posters','b5')">POSTERS</button>
</div>

<div id="home" class="page show">
<h2>810 SOCCER TOURNAMENT - Pimville</h2>
<div class="card">Welcome Chairman! Today fixtures are ready. Go to FIXTURES tab.</div>
</div>

<div id="fixtures" class="page">
<h3>Fixtures</h3>
<div id="fixList"></div>
<div class="card">
<select id="teamA"></select> vs <select id="teamB"></select><br>
<input id="scoreA" type="number" placeholder="Goals A" style="width:80px">
<input id="scoreB" type="number" placeholder="Goals B" style="width:80px">
<button onclick="addResult()">ADD RESULT</button>
</div>
</div>

<div id="teams" class="page">
<h3>Teams</h3>
<div id="teamsList"></div>
<div class="card">
<input id="newTeam" placeholder="New Team Name">
<button onclick="addTeam()">ADD TEAM</button>
</div>
</div>

<div id="table" class="page">
<h3>Table - P W D L GF GA GD Pts</h3>
<table>
<thead><tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Del</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div id="posters" class="page">
<h3>Posters</h3>
<div id="posterList"></div>
</div>

<script>
// --- DATA ---
let teams = ["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];
let results = [];

function goPage(pageId,btnId){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
document.getElementById(pageId).classList.add('show');
document.getElementById(btnId).classList.add('active');
if(pageId==='fixtures') renderFixtures();
if(pageId==='teams') renderTeams();
if(pageId==='table') renderTable();
if(pageId==='posters') renderPosters();
}

function renderTeams(){
let selA=document.getElementById('teamA'); let selB=document.getElementById('teamB');
selA.innerHTML=""; selB.innerHTML="";
teams.forEach(t=>{
selA.innerHTML+=<option>${t}</option>;
selB.innerHTML+=<option>${t}</option>;
});
let div=document.getElementById('teamsList'); div.innerHTML="";
teams.forEach((t,i)=>{
div.innerHTML+=<div class="card">${t} <button onclick="delTeam(${i})" style="float:right;background:red;color:white">X</button></div>;
});
}
function addTeam(){
let v=document.getElementById('newTeam').value.trim();
if(!v) return alert('Enter team name');
if(teams.includes(v)) return alert('Team exists');
teams.push(v);
document.getElementById('newTeam').value="";
renderTeams();
renderTable();
alert('Team added: '+v);
}

function delTeam(i){
if(!confirm('Delete '+teams[i]+'?')) return;
teams.splice(i,1);
renderTeams();
renderTable();
}

function renderFixtures(){
let div=document.getElementById('fixList'); div.innerHTML="";
if(results.length==0) div.innerHTML="<div class='card'>No results yet</div>";
results.forEach(r=>{
div.innerHTML+=<div class="card">${r.a} ${r.sa} - ${r.sb} ${r.b}</div>;
});
renderTeams();
}

function addResult(){
let a=document.getElementById('teamA').value;
let b=document.getElementById('teamB').value;
let sa=parseInt(document.getElementById('scoreA').value);
let sb=parseInt(document.getElementById('scoreB').value);
if(a===b) return alert('Choose 2 different teams!');
if(isNaN(sa)||isNaN(sb)) return alert('Enter both scores');
results.push({a,b,sa,sb});
renderFixtures();
renderTable();
renderPosters();
alert('Result saved');
}

function renderTable(){
let stats={};
teams.forEach(t=>stats[t]={P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0});
results.forEach(r=>{
if(!stats[r.a]||!stats[r.b]) return;
stats[r.a].P++; stats[r.b].P++;
stats[r.a].GF+=r.sa; stats[r.a].GA+=r.sb;
stats[r.b].GF+=r.sb; stats[r.b].GA+=r.sa;
stats[r.a].GD=stats[r.a].GF-stats[r.a].GA;
stats[r.b].GD=stats[r.b].GF-stats[r.b].GA;
if(r.sa>r.sb){stats[r.a].W++; stats[r.a].Pts+=3; stats[r.b].L++;}
else if(r.sa<r.sb){stats[r.b].W++; stats[r.b].Pts+=3; stats[r.a].L++;}
else{stats[r.a].D++; stats[r.b].D++; stats[r.a].Pts+=1; stats[r.b].Pts+=1;}
});
let sorted=Object.keys(stats).sort((x,y)=>stats[y].Pts-stats[x].Pts || stats[y].GD-stats[x].GD);
let tbody=document.getElementById('tableBody'); tbody.innerHTML="";
sorted.forEach(t=>{
let s=stats[t];
tbody.innerHTML+=<tr><td>${t}</td><td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td><td>${s.GF}</td><td>${s.GA}</td><td>${s.GD}</td><td><b>${s.Pts}</b></td><td><button onclick="delTeam(${teams.indexOf(t)})" style="background:red;color:white;padding:4px">X</button></td></tr>;
});
}

// POSTERS - FIXED genPoster defined
function renderPosters(){
let div=document.getElementById('posterList'); div.innerHTML="";
results.forEach(r=>{
div.innerHTML+=genPoster(r.a,r.b,r.sa,r.sb);
});
if(results.length==0) div.innerHTML="<div class='card'>Add results to see posters</div>";
}

function genPoster(teamA, teamB, scoreA, scoreB){
return 
<div class="poster">
<h4>810 TOURNAMENT</h4>
<div style="display:flex;justify-content:space-around;align-items:center">
<div><b>${teamA}</b></div>
<div class="logoSmall">810</div>
<div><b>${teamB}</b></div>
</div>
<div class="vs">${scoreA} - ${scoreB}</div>
<small>Pimville, Soweto</small>
</div>;
}

// init
renderTeams();
renderTable();
</script>
</body>
</html>
