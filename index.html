<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>810 TOURNAMENT - Pimville</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#111;color:#fff}.tabs{display:flex;position:sticky;top:0;background:#111;z-index:99}.tabs a{flex:1;padding:14px;text-align:center;background:#222;color:#fff;text-decoration:none;font-weight:bold;border:1px solid #000}.tabs a.active{background:#ffcc00;color:#000}.page{display:none;padding:12px}.page:target{display:block}#home{display:block}.page:target~#home{display:none}.card{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:8px}input,select{padding:10px;margin:4px;border-radius:6px;border:none}button{padding:10px 14px;margin:4px;border:none;background:#ffcc00;font-weight:bold;border-radius:6px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:7px;text-align:center;font-size:12px}th{background:#222;color:#ffcc00}</style></head><body>
<div class="tabs"><a href="#home" id="l1" class="active" onclick="act('l1')">HOME</a><a href="#fixtures" id="l2" onclick="act('l2')">FIXTURES</a><a href="#teams" id="l3" onclick="act('l3')">TEAMS</a><a href="#table" id="l4" onclick="act('l4')">TABLE</a><a href="#posters" id="l5" onclick="act('l5')">POSTERS</a></div>

<div id="posters" class="page"><h3>Posters - 810 Logo Middle</h3><div id="posterList"></div></div>
<div id="table" class="page"><h3>League Table</h3><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div id="teams" class="page"><h3>Teams List</h3><div id="teamsList"></div><div class="card"><input id="newTeam" placeholder="e.g Orlando Pirates"><button onclick="addT()">ADD TEAM</button> <button onclick="resetT()" style="background:#fff">RESET 8 TEAMS</button></div></div>
<div id="fixtures" class="page"><h3>Fixtures</h3><div id="fixList"></div><div class="card"><select id="teamA"></select> vs <select id="teamB"></select><br><input id="scoreA" type="number" placeholder="A" style="width:70px"><input id="scoreB" type="number" placeholder="B" style="width:70px"><button onclick="addR()">ADD RESULT</button></div></div>
<div id="home" class="page"><h2 style="color:#ffcc00">810 SOCCER TOURNAMENT - Pimville, Soweto</h2><div class="card">Welcome Chairman!<br>• Click TEAMS then RESET 8 TEAMS to restore list<br>• Then ADD TEAM works<br>• Add scores in FIXTURES</div></div>

<script>
function act(id){document.querySelectorAll('.tabs a').forEach(a=>a.classList.remove('active'));document.getElementById(id).classList.add('active');}
var teams=["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];
var results=[];
function save(){localStorage.setItem('t810',JSON.stringify(teams));localStorage.setItem('r810',JSON.stringify(results));}
function renderTeams(){var a=document.getElementById('teamA'),b=document.getElementById('teamB');a.innerHTML='';b.innerHTML='';teams.forEach(t=>{a.innerHTML+='<option>'+t+'</option>';b.innerHTML+='<option>'+t+'</option>';});var d=document.getElementById('teamsList');d.innerHTML='';teams.forEach((t,i)=>{d.innerHTML+='<div class=card>'+(i+1)+'. '+t+' <button onclick=delT('+i+') style=float:right;background:red;color:white;padding:4px 8px>X</button></div>';});}
function addT(){var el=document.getElementById('newTeam');var v=el.value.trim();if(!v){alert('Type team name');return;}teams.push(v);el.value='';save();renderTeams();renderTable();alert('Added: '+v);}
function delT(i){if(!confirm('Delete '+teams[i]+'?'))return;teams.splice(i,1);save();renderTeams();renderTable();}
function resetT(){localStorage.clear();teams=["JOMO FC","810 FC","Pimville United","Soweto Stars","Kaizer Youth","Pirates Youth","Mamelodi","SuperSport"];results=[];save();renderTeams();renderFixtures();renderTable();renderPosters();alert('RESET DONE - 8 teams restored');location.href='#teams';}
function renderFixtures(){var d=document.getElementById('fixList');d.innerHTML='';if(results.length==0){d.innerHTML='<div class=card>No results yet</div>';return;}results.forEach((r,i)=>{d.innerHTML+='<div class=card>#'+(i+1)+' '+r.a+' '+r.sa+' - '+r.sb+' '+r.b+'</div>';});}
function addR(){var a=document.getElementById('teamA').value,b=document.getElementById('teamB').value,sa=parseInt(document.getElementById('scoreA').value),sb=parseInt(document.getElementById('scoreB').value);if(a===b){alert('Pick 2 different teams');return;}if(isNaN(sa)||isNaN(sb)){alert('Enter scores');return;}results.push({a:a,b:b,sa:sa,sb:sb});save();renderFixtures();renderTable();renderPosters();document.getElementById('scoreA').value='';document.getElementById('scoreB').value='';}
function renderTable(){var stats={};teams.forEach(t=>stats[t]={P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0});results.forEach(r=>{if(!stats[r.a]!stats[r.b])return;stats[r.a].P++;stats[r.b].P++;stats[r.a].GF+=r.sa;stats[r.a].GA+=r.sb;stats[r.b].GF+=r.sb;stats[r.b].GA+=r.sa;stats[r.a].GD=stats[r.a].GF-stats[r.a].GA;stats[r.b].GD=stats[r.b].GF-stats[r.b].GA;if(r.sa>r.sb){stats[r.a].W++;stats[r.a].Pts+=3;stats[r.b].L++;}else if(r.sa<r.sb){stats[r.b].W++;stats[r.b].Pts+=3;stats[r.a].L++;}else{stats[r.a].D++;stats[r.b].D++;stats[r.a].Pts+=1;stats[r.b].Pts+=1;}});var sorted=Object.keys(stats).sort((x,y)=>stats[y].Pts-stats[x].Ptsstats[y].GD-stats[x].GD);var tb=document.getElementById('tableBody');tb.innerHTML='';sorted.forEach((t,i)=>{var s=stats[t];tb.innerHTML+='<tr><td>'+(i+1)+'</td><td style=text-align:left><b>'+t+'</b></td><td>'+s.P+'</td><td>'+s.W+'</td><td>'+s.D+'</td><td>'+s.L+'</td><td>'+s.GF+'</td><td>'+s.GA+'</td><td>'+s.GD+'</td><td><b>'+s.Pts+'</b></td></tr>';});}
function renderPosters(){var d=document.getElementById('posterList');d.innerHTML='';if(results.length==0){d.innerHTML='<div class=card>No posters - add result first</div>';return;}results.forEach(r=>{d.innerHTML+='<div class=card style=background:#fff;color:#000;text-align:center'><small>810 TOURNAMENT</small><div style=display:flex;justify-content:space-around;align-items:center;margin:10px 0><b>'+r.a+'</b><div style=width:46px;height:46px;background:#ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #000>810</div><b>'+r.b+'</b></div><div style=font-size:28px;font-weight:900>'+r.sa+' - '+r.sb+'</div></div>';});}
renderTeams();renderFixtures();renderTable();renderPosters();
</script></body></html>
